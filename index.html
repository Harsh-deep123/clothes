<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAYRO Store - Define Your Style</title>
    <meta name="description" content="Minimalist luxury menswear collection featuring precision tailoring, editorial aesthetics, and architectural design." />
    <meta property="og:title" content="ZAYRO Store - Define Your Style" />
    <meta property="og:description" content="Minimalist luxury menswear collection featuring precision tailoring, editorial aesthetics, and architectural design." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://js.stripe.com" />
    <script>
      (function () {
        try {
          var key = 'zayro_theme';
          var theme = localStorage.getItem(key);
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <script src="https://js.stripe.com/dahlia/stripe.js" async></script>
  </head>
  <body class="antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
